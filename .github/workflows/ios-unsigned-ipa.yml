name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a direct IPA download as a GitHub Release asset
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  unsigned-ipa:
    name: Compile and package unsigned IPA
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and synchronize shared reader
        working-directory: frontend
        run: |
          npm ci
          npm run mobile:sync

      - name: Compile iPhone app without signing
        run: |
          xcodebuild \
            -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            -derivedDataPath "$RUNNER_TEMP/booksync-derived-data" \
            build

      - name: Create numbered unsigned IPA
        shell: bash
        run: |
          app_version=$(node -p "require('./frontend/package.json').version")
          ipa_name="BookSync-Reader-v${app_version}-unsigned-r${GITHUB_RUN_NUMBER}.ipa"
          app_bundle=$(find "$RUNNER_TEMP/booksync-derived-data/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_bundle"
          payload="$RUNNER_TEMP/Payload"
          rm -rf "$payload" "$RUNNER_TEMP/$ipa_name"
          mkdir -p "$payload"
          cp -R "$app_bundle" "$payload/"
          (
            cd "$RUNNER_TEMP"
            zip -qry "$ipa_name" Payload
          )
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"
          echo "IPA_PATH=$RUNNER_TEMP/$ipa_name" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ios-v${app_version}-unsigned-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BookSync-Reader-v${{ github.run_number }}-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct IPA download
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "$IPA_PATH#$IPA_NAME" \
            --title "BookSync Reader v${RELEASE_TAG#ios-v}" \
            --notes "Unsigned iPhone build from GitHub Actions run #${GITHUB_RUN_NUMBER}. This artifact verifies the app build but cannot be installed on an iPhone without Apple signing."
